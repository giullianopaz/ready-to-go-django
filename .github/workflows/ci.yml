name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: django_db
          POSTGRES_USER: django
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U django -d django_db"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: uv sync --dev

      - name: Lint with Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type Check with Pyright
        run: uv run pyright

      - name: Run Migrations
        env:
          DJANGO_ENV: test
          POSTGRES_PASSWORD: test_password
        run: uv run python manage.py migrate --noinput

      - name: Run Pytest Suite with Coverage
        env:
          DJANGO_ENV: test
          POSTGRES_PASSWORD: test_password
        run: uv run pytest --cov=apps --cov-report=xml tests/ apps/
