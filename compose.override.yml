services:
  web:
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    volumes:
      - ./apps:/app/apps
      - ./config:/app/config
      - ./cotton:/app/cotton
      - ./templates:/app/templates
      - ./static:/app/static
      - ./scripts:/app/scripts
      - ./manage.py:/app/manage.py
    environment:
      DJANGO_ENV: development
      DEBUG: "True"

  worker:
    volumes:
      - ./apps:/app/apps
      - ./config:/app/config
      - ./scripts:/app/scripts
      - ./manage.py:/app/manage.py
    environment:
      DJANGO_ENV: development
      DEBUG: "True"
