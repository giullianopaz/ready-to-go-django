[project]
name = "ready-to-go-django"
version = "0.1.0"
description = "State-of-the-Art Django Architecture for High-Velocity Startups (The Majestic Monolith in 2026)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core Framework & Drivers
    "django>=6.0",
    "psycopg[binary]>=3.2.0",

    # ASGI Server
    "granian>=2.0.0",

    # Modern Admin & Components
    "django-unfold>=0.50.0",
    "django-cotton>=1.0.0",
    "django-htmx>=1.21.0",
    "neapolitan>=25.0.0",

    # Modern APIs & Validation
    "django-ninja>=1.4.0",
    "pydantic[email]>=2.10.0",

    # Background Tasks & Queue (PostgreSQL-backed)
    "django-tasks>=0.12.0",
    "django-tasks-db>=0.13.0",

    # Observability & Metrics
    "django-structlog>=9.0.0",
    "structlog>=24.0.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-instrumentation-django>=0.48b0",
    "opentelemetry-instrumentation-psycopg>=0.48b0",
    "django-prometheus>=2.3.0",

    # Security & Sanitization
    "argon2-cffi>=23.1.0",
    "nh3>=0.2.18",
    "django-csp>=4.0",
    "pyjwt[crypto]>=2.9.0",

    # Configuration & Extensions
    "django-environ>=0.12.0",
    "django-extensions>=3.2.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-django>=4.9.0",
    "pytest-cov>=5.0.0",
    "factory-boy>=3.3.0",
    "faker>=30.0.0",
    "ruff>=0.7.0",
    "pyright>=1.1.380",
    "pre-commit>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps", "config"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "migrations",
    "static",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # function calls in argument defaults (e.g. Depends/Query)
    "UP046", # Generic class syntax (Pydantic V2 compatibility)
]

[tool.ruff.lint.per-file-ignores]
"config/settings/*" = ["F403", "F405"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
reportAttributeAccessIssue = false
reportIncompatibleVariableOverride = false
reportIncompatibleMethodOverride = false
reportArgumentType = false
reportAssignmentType = false
reportReturnType = false
include = ["apps", "config", "scripts"]
exclude = ["**/migrations/**", "**/tests/**", ".venv"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = ["tests", "apps"]
addopts = "-ra -q --strict-markers"
markers = [
    "unit: marks unit tests",
    "integration: marks integration tests",
    "slow: marks slow-running tests",
]
